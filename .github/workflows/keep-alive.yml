name: Keep demos warm

# Pings the live Render demo every 10 minutes during a roughly
# 9am-9pm Pacific window (16:00-03:59 UTC covers PDT; it drifts to
# 8am-8pm during PST months, which is fine). Churn ROI now runs on
# GitHub Pages and needs no ping. Outside the window the demo sleeps
# normally and takes about a minute to wake.
#
# GitHub disables scheduled workflows automatically after 60 days
# with no repo activity. A commit or a manual "Run workflow" click
# re-enables it.

on:
  schedule:
    - cron: "*/10 16-23,0-3 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Starbucks Order Whisperer
        run: curl -fsS --max-time 20 https://starbucks-order-whisperer.onrender.com/ || true
